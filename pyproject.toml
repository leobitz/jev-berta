[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "jev-berta"
version = "0.1.0"
description = "Importable inference wrapper for the JevBerta zero-shot classifier"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Leo" }
]
dependencies = [
  "huggingface-hub>=0.24",
  "torch>=2.2",
  "transformers>=4.45",
]
keywords = ["classification", "huggingface", "inference", "zero-shot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://huggingface.co/leobitz/jev-berta-base-zeroshot-classifier"
Repository = "https://huggingface.co/leobitz/jev-berta-base-zeroshot-classifier"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_berta"]
